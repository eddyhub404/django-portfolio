{% extends 'base.html' %}
{% block title %}
  Home - My Portfolio
{% endblock %}
{% include 'includes/navbar.html' %}
{% block content %}
  <section id="contact" class="bg-black text-white py-32 px-10">
    <h2 class="text-5xl font-bold mb-12">Contact Me</h2>

    <form class="max-w-2xl mx-auto">
      <div class="mb-6">
        <label class="block mb-2 text-lg">Your Name</label>

        <input type="text" placeholder="Enter your name" class="w-full p-4 rounded-xl bg-gray-900 border border-gray-700 focus:outline-none" />
      </div>

      <div class="mb-6">
        <label class="block mb-2 text-lg">Your Email</label>

        <input type="email" placeholder="Enter your email" class="w-full p-4 rounded-xl bg-gray-900 border border-gray-700 focus:outline-none" />
      </div>

      <div class="mb-6">
        <label class="block mb-2 text-lg">Your Message</label>

        <textarea rows="5" placeholder="Write your message..." class="w-full p-4 rounded-xl bg-gray-900 border border-gray-700 focus:outline-none"></textarea>
      </div>

      <button class="bg-purple-700 hover:bg-purple-800 px-8 py-4 rounded-xl text-lg">Send Message</button>
    </form>
  </section>
{% endblock %}
